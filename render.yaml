##############################################################################
# render.yaml — Render Blueprint for SATyping
##############################################################################

services:
  # --------------------------------------------------------------------------
  # API Server
  # --------------------------------------------------------------------------
  - type: web
    name: satyping-api
    runtime: node
    region: oregon
    plan: free

    buildCommand: >
      npm install -g pnpm &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @workspace/api-server run build

    startCommand: node artifacts/api-server/dist/index.mjs

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: SESSION_SECRET
        sync: false

      - key: CORS_ORIGIN
        sync: false

  # --------------------------------------------------------------------------
  # Frontend Static Site
  # --------------------------------------------------------------------------
  - type: web
    name: satyping-web
    runtime: static
    plan: free

    buildCommand: >
      npm install -g pnpm &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @workspace/gcc-tbc run build

    staticPublishPath: artifacts/gcc-tbc/dist/public

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: NODE_ENV
        value: production

      - key: BASE_PATH
        value: /

      - key: VITE_API_BASE_URL
        sync: false