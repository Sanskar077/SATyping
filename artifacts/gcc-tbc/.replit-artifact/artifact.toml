kind = "web"
previewPath = "/"
title = "GCC-TBC Pro"
version = "1.0.0"
id = "artifacts/gcc-tbc"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25733

[services.development]
run = "pnpm --filter @workspace/gcc-tbc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gcc-tbc", "run", "build" ]
publicDir = "artifacts/gcc-tbc/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25733"
BASE_PATH = "/"
