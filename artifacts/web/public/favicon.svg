    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B2018"/>
      <stop offset="100%" stop-color="#1C1512"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#bg)"/>
  <text x="17" y="33" text-anchor="middle" font-size="26" font-weight="700"
        font-family="Outfit,system-ui,-apple-system,sans-serif" fill="#F0E8DC">S</text>
  <rect x="28" y="13" width="4" height="22" rx="2" fill="#E8734F"/>
</svg>
