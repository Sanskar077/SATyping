        page:
          type: integer
        limit:
          type: integer

    # ─── TYPING SESSION SCHEMAS ───────────────────────────────────────────────
    TypingSession:
      type: object
      required: [id, userId, passageId, language, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        passageId:
          type: integer
        language:
          type: string
          enum: [english, hindi, marathi]
        status:
          type: string
          enum: [active, completed, abandoned]
        grossWpm:
          type: ["number", "null"]
        netWpm:
          type: ["number", "null"]
        accuracy:
          type: ["number", "null"]
        totalChars:
          type: ["integer", "null"]
        correctChars:
          type: ["integer", "null"]
        incorrectChars:
          type: ["integer", "null"]
        backspaceCount:
          type: ["integer", "null"]
        durationSeconds:
          type: ["integer", "null"]
        keystrokeData:
          type: ["string", "null"]
