        id:
          type: integer
        lessonId:
          type: integer
        accuracy:
          type: number
        wpm:
          type: number
        completedAt:
          type: string
          format: date-time

    LessonCompleteInput:
      type: object
      required: [accuracy, wpm]
      properties:
        accuracy:
          type: number
        wpm:
          type: number

    # ─── BULK IMPORT SCHEMAS (Feature 9) ─────────────────────────────────────────
    BulkPassageRow:
      type: object
      required: [title, content, language, difficulty, speedCategory]
      properties:
        title:
          type: string
        content:
          type: string
        language:
          type: string
          enum: [english, hindi, marathi]
        difficulty:
          type: string
          enum: [easy, medium, hard]
        speedCategory:
          type: integer
          enum: [30, 40, 50, 60]

    BulkImportInput:
      type: object
      required: [passages]
      properties:
        passages:
          type: array
          items:
            $ref: "#/components/schemas/BulkPassageRow"

    ValidationError:
      type: object
      required: [row, field, message]
      properties:
        row:
          type: integer
        field:
          type: string
        message:
          type: string

    DuplicateWarning:
      type: object
      required: [row, title, existingId]
      properties:
        row:
          type: integer
        title:
          type: string
        existingId:
          type: integer

    BulkImportValidation:
      type: object
      required: [valid, errors, duplicates, validCount]
      properties:
        valid:
          type: array
          items:
            $ref: "#/components/schemas/BulkPassageRow"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
        duplicates:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateWarning"
        validCount:
          type: integer
        errorCount:
          type: integer
        duplicateCount:
          type: integer

    BulkImportResult:
      type: object
      required: [imported, skipped, errors]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
        passages:
          type: array
          items:
            $ref: "#/components/schemas/Passage"

    # ─── PLAN SCHEMAS ─────────────────────────────────────────────────────────
    CommercePlan:
      type: object
      required: [id, name, priceInPaise, currency, durationDays, forInstitute, features, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        priceInPaise:
          type: integer
        currency:
          type: string
        durationDays:
          type: integer
        forInstitute:
          type: boolean
        features:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CommercePlanInput:
      type: object
      required: [name, priceInPaise, durationDays]
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: string
        priceInPaise:
          type: integer
          minimum: 0
        currency:
          type: string
        durationDays:
          type: integer
          minimum: 1
        forInstitute:
          type: boolean
        features:
          type: array
          items:
            type: string

    CommercePlanUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: ["string", "null"]
        priceInPaise:
          type: integer
          minimum: 0
        durationDays:
          type: integer
          minimum: 1
        features:
          type: array
          items:
            type: string
        isActive:
          type: boolean

    CommercePlanListResponse:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/CommercePlan"

    # ─── OFFER SCHEMAS ────────────────────────────────────────────────────────
    Offer:
      type: object
      required: [id, code, discountType, discountValue, redemptionCount, isActive, createdAt]
      properties:
        id:
          type: integer
        code:
          type: string
        description:
          type: ["string", "null"]
        discountType:
          type: string
          enum: [percent, flat]
        discountValue:
          type: number
        planId:
          type: ["integer", "null"]
        maxRedemptions:
          type: ["integer", "null"]
        redemptionCount:
          type: integer
        expiresAt:
          type: ["string", "null"]
          format: date-time
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    OfferInput:
      type: object
      required: [code, discountType, discountValue]
      properties:
        code:
          type: string
          minLength: 3
        description:
          type: string
        discountType:
          type: string
          enum: [percent, flat]
        discountValue:
          type: number
          minimum: 0
        planId:
          type: integer
        maxRedemptions:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time

    OfferUpdate:
      type: object
      properties:
        description:
          type: ["string", "null"]
        discountType:
          type: string
          enum: [percent, flat]
        discountValue:
          type: number
          minimum: 0
        maxRedemptions:
          type: ["integer", "null"]
        expiresAt:
          type: ["string", "null"]
          format: date-time
        isActive:
          type: boolean

    OfferListResponse:
      type: object
      required: [offers]
      properties:
        offers:
          type: array
          items:
            $ref: "#/components/schemas/Offer"

    OfferValidation:
      type: object
      required: [code, discountType, discountValue, finalAmountInPaise]
      properties:
        code:
          type: string
        discountType:
          type: string
          enum: [percent, flat]
        discountValue:
          type: number
        finalAmountInPaise:
          type: integer

    # ─── COMMISSION SCHEMAS ───────────────────────────────────────────────────
    Commission:
      type: object
      required: [id, instituteId, paymentId, studentUserId, amountInPaise, commissionType, commissionRate, status, createdAt]
      properties:
        id:
          type: integer
        instituteId:
          type: integer
        paymentId:
          type: integer
        studentUserId:
          type: integer
        amountInPaise:
          type: integer
        commissionType:
          type: string
          enum: [percent, flat]
        commissionRate:
          type: number
        status:
          type: string
          enum: [pending, approved, paid]
        paidAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    CommissionStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, paid]

    CommissionListResponse:
      type: object
      required: [commissions, total, page, limit]
      properties:
        commissions:
          type: array
          items:
            $ref: "#/components/schemas/Commission"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ─── HIERARCHY-AWARE REGISTRATION SCHEMAS ────────────────────────────────
    StudentRegisterInput:
      type: object
      required: [email, password, name, membershipMode]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string
          minLength: 2
        phone:
          type: string
        membershipMode:
          type: string
          enum: [join, independent]
          description: >
            "join" sets both instituteId and referredByInstituteId (must resolve to a real
            institute via instituteId or referralCode, or the request is rejected).
            "independent" leaves instituteId null; an optional referralCode only sets
            referredByInstituteId for commission attribution, and is silently ignored if invalid.
        instituteId:
          type: integer
          description: Selected institute id, used when membershipMode is "join".
        referralCode:
          type: string
          description: >
            Institute referral code. Required to resolve "join" if instituteId isn't given;
            optional commission-only attribution when membershipMode is "independent".

    InstituteRegisterInput:
      type: object
      required: [instituteName, adminName, adminEmail, adminPassword]
      properties:
        instituteName:
          type: string
          minLength: 2
        address:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        adminName:
          type: string
          minLength: 2
        adminEmail:
          type: string
          format: email
        adminPassword:
          type: string
          minLength: 6

    AddInstituteStudentInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string
          minLength: 2
        phone:
          type: string

    # ─── PAYMENT SCHEMAS ──────────────────────────────────────────────────────
    RazorpayWebhookPayload:
      type: object
      description: Gateway-defined shape — validated by HMAC signature, not by strict schema.

    CheckoutInput:
      type: object
      required: [planId]
      properties:
        planId:
          type: integer
        offerCode:
          type: string

    CheckoutResponse:
      type: object
      required: [paymentId, gatewayOrderId, amount, currency, razorpayKeyId]
      properties:
        paymentId:
          type: integer
        gatewayOrderId:
          type: string
        amount:
          type: integer
        currency:
          type: string
        razorpayKeyId:
          type: string

    VerifyPaymentInput:
      type: object
      required: [razorpayOrderId, razorpayPaymentId, razorpaySignature]
      description: >
        The three values Razorpay's checkout handler returns to the browser. All are verified
        server-side; the amount and plan are never taken from the client.
      properties:
        razorpayOrderId:
          type: string
          description: The `razorpay_order_id` from the checkout handler.
        razorpayPaymentId:
          type: string
          description: The `razorpay_payment_id` from the checkout handler.
        razorpaySignature:
          type: string
          description: HMAC-SHA256 of `order_id|payment_id`, signed with the Razorpay key secret.

    PaymentVerificationResult:
      type: object
      required: [status, alreadyProcessed]
      properties:
        status:
          type: string
          enum: [success]
        alreadyProcessed:
          type: boolean
          description: True when the webhook had already activated this payment first.

    Payment:
      type: object
      required: [id, payerType, planId, amountInPaise, currency, status, gateway, createdAt]
      properties:
        id:
          type: integer
        payerType:
          type: string
          enum: [student, institute]
        planId:
          type: integer
        offerId:
          type: ["integer", "null"]
        amountInPaise:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum: [pending, success, failed, refunded]
        gateway:
          type: string
        gatewayOrderId:
          type: ["string", "null"]
        gatewayPaymentId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    PaymentListResponse:
      type: object
      required: [payments, total, page, limit]
      properties:
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ─── INVOICE SCHEMAS ──────────────────────────────────────────────────────
    Invoice:
      type: object
      required: [id, paymentId, invoiceNumber, amountInPaise, currency, issuedAt]
      properties:
        id:
          type: integer
        paymentId:
          type: integer
        invoiceNumber:
          type: string
        amountInPaise:
          type: integer
        currency:
          type: string
        issuedAt:
          type: string
          format: date-time

    InvoiceListResponse:
      type: object
      required: [invoices]
      properties:
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"

    # ─── NOTIFICATION SCHEMAS ─────────────────────────────────────────────────
    Notification:
      type: object
      required: [id, type, title, message, isRead, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [payment_success, commission_credited, commission_paid, institute_approved, institute_suspended]
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationListResponse:
      type: object
      required: [notifications, total, page, limit]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    UnreadCountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer

    # ─── ACTIVITY LOG SCHEMAS ─────────────────────────────────────────────────
    AuditLogEntry:
      type: object
      required: [id, userId, action, targetType, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: ["integer", "null"]
        metadata:
          type: ["object", "null"]
        createdAt:
          type: string
          format: date-time

    AuditLogListResponse:
      type: object
      required: [logs, total, page, limit]
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    LoginLogEntry:
      type: object
      required: [id, email, success, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        email:
          type: string
        success:
          type: boolean
        ipAddress:
          type: ["string", "null"]
        userAgent:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    LoginLogListResponse:
      type: object
      required: [logs, total, page, limit]
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/LoginLogEntry"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ─── ANALYTICS SCHEMAS ────────────────────────────────────────────────────
    RevenuePoint:
      type: object
      required: [month, revenueInPaise]
      properties:
        month:
          type: string
        revenueInPaise:
          type: integer

    AnalyticsOverview:
      type: object
      required: [totalRevenueInPaise, totalStudents, independentStudents, totalInstitutes, activeInstitutes, inactiveAccounts, revenueByMonth, planDistribution]
      properties:
        totalRevenueInPaise:
          type: integer
        totalStudents:
          type: integer
        independentStudents:
          type: integer
        totalInstitutes:
          type: integer
        activeInstitutes:
          type: integer
        inactiveAccounts:
          type: integer
        revenueByMonth:
          type: array
          items:
            $ref: "#/components/schemas/RevenuePoint"
        planDistribution:
          type: array
          items:
            type: object
            required: [plan, count]
            properties:
              plan:
                type: string
              count:
                type: integer

    SetPremiumInput:
      type: object
      required: [premium]
      properties:
        premium:
          type: boolean
          description: true grants full access immediately, ignoring payment/subscription entirely; false revokes it.

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    VerifyEmailInput:
      type: object
      required: [token]
      properties:
        token:
          type: string

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 6
