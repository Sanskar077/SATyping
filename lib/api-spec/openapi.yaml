        correctChars:
          type: integer
        incorrectChars:
          type: integer
        wrongWords:
          type: integer
        backspaceCount:
          type: integer
        durationSeconds:
          type: integer

    TestAttemptListResponse:
      type: object
      required: [attempts, total, page, limit]
      properties:
        attempts:
