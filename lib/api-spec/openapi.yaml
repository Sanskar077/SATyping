        status:
          type: string
          enum: [completed, abandoned]
        grossWpm:
          type: number
        netWpm:
          type: number
        accuracy:
          type: number
        totalChars:
          type: integer
        correctChars:
          type: integer
        incorrectChars:
          type: integer
        backspaceCount:
          type: integer
        durationSeconds:
          type: integer
        keystrokeData:
          type: string
          description: JSON array of keystroke entries for replay
        wpmTimeline:
          type: string
          description: JSON array of WPM snapshots for the timeline graph
        userInput:
          type: string
          description: Raw user input text for error diff analysis

