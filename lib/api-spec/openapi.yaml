openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SATyping Typing Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: institutes
    description: Institute management
  - name: passages
    description: Typing passage management
  - name: typing
    description: Typing session operations
  - name: tests
    description: Exam/test operations
  - name: results
    description: Result and analytics
  - name: certificates
    description: Certificate generation
  - name: subscriptions
    description: Subscription management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register/student:
    post:
      operationId: registerStudent
      tags: [auth]
      summary: Register a new student, either joining an institute or independently
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentRegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register/institute:
    post:
      operationId: registerInstitute
      tags: [auth]
      summary: Register a new institute together with its first institute admin, in one transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstituteRegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout and revoke token
      responses:
        "204":
          description: Logged out

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email address using the token from the verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Resend the email verification link to the current user
      responses:
        "200":
          description: Sent (or already verified)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset email — always returns 200 regardless of whether the email exists, to avoid leaking registered emails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Always returns this, whether or not the email exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using the token from the reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── USERS ───────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: instituteId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── INSTITUTES ──────────────────────────────────────────────────────────────
  /institutes:
    get:
      operationId: listInstitutes
      tags: [institutes]
      summary: List institutes
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Institutes list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstituteListResponse"

    post:
      operationId: createInstitute
      tags: [institutes]
      summary: Create a new institute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstituteInput"
      responses:
        "201":
          description: Created institute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institute"

  /institutes/{id}:
    get:
      operationId: getInstitute
      tags: [institutes]
      summary: Get institute by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Institute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institute"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateInstitute
      tags: [institutes]
      summary: Update institute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstituteUpdate"
      responses:
        "200":
          description: Updated institute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institute"

    delete:
      operationId: deleteInstitute
      tags: [institutes]
      summary: Delete institute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /institutes/{id}/students:
    get:
      operationId: getInstituteStudents
      tags: [institutes]
      summary: Get students of an institute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Students list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

    post:
      operationId: addInstituteStudent
      tags: [institutes]
      summary: Institute admin directly creates a student account under their institute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddInstituteStudentInput"
      responses:
        "201":
          description: Created student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /institutes/{id}/students/{userId}:
    delete:
      operationId: removeInstituteStudent
      tags: [institutes]
      summary: Remove a student from an institute — demotes to independent, never deletes the account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed (demoted to independent)

  /users/{id}/premium:
    patch:
      operationId: setUserPremium
      tags: [users]
      summary: Owner manually grants or revokes Premium access for a user — bypasses payment entirely
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPremiumInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/leave-institute:
    post:
      operationId: leaveInstitute
      tags: [users]
      summary: A student leaves their institute — demotes to independent, keeps account/history/results
      responses:
        "204":
          description: Left institute

  /institutes/{id}/stats:
    get:
      operationId: getInstituteStats
      tags: [institutes]
      summary: Get institute analytics/stats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Institute stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstituteStats"

  # ─── BATCHES ─────────────────────────────────────────────────────────────────
  /institutes/{id}/approve:
    post:
      operationId: approveInstitute
      tags: [institutes]
      summary: Owner approves an institute's account (inactive → active), e.g. after manual/offline payment verification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institute"

  /institutes/{id}/suspend:
    post:
      operationId: suspendInstitute
      tags: [institutes]
      summary: Owner suspends an institute's account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institute"

  /institutes/{id}/premium:
    patch:
      operationId: setInstitutePremium
      tags: [institutes]
      summary: Owner manually grants or revokes Premium access for an institute (covers its whole roster) — bypasses payment entirely
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPremiumInput"
      responses:
        "200":
          description: Updated institute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institute"

  /batches:
    get:
      operationId: listBatches
      tags: [institutes]
      summary: List batches for institute
      parameters:
        - name: instituteId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Batches list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Batch"

    post:
      operationId: createBatch
      tags: [institutes]
      summary: Create a new batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchInput"
      responses:
        "201":
          description: Created batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  /batches/{id}:
    get:
      operationId: getBatch
      tags: [institutes]
      summary: Get batch by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

    patch:
      operationId: updateBatch
      tags: [institutes]
      summary: Update batch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchUpdate"
      responses:
        "200":
          description: Updated batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

    delete:
      operationId: deleteBatch
      tags: [institutes]
      summary: Delete batch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── PASSAGES ─────────────────────────────────────────────────────────────────
  /passages:
    get:
      operationId: listPassages
      tags: [passages]
      summary: List typing passages
      parameters:
        - name: language
          in: query
          schema:
            type: string
            enum: [english, hindi, marathi]
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [easy, medium, hard]
        - name: speedCategory
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Passages list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassageListResponse"

    post:
      operationId: createPassage
      tags: [passages]
      summary: Create a new passage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PassageInput"
      responses:
        "201":
          description: Created passage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passage"

  /passages/random:
    get:
      operationId: getRandomPassage
      tags: [passages]
      summary: Get a random passage by criteria
      parameters:
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum: [english, hindi, marathi]
        - name: speedCategory
          in: query
          required: true
          schema:
            type: integer
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [easy, medium, hard]
      responses:
        "200":
          description: Random passage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passage"
        "404":
          description: No passage found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /passages/{id}:
    get:
      operationId: getPassage
      tags: [passages]
      summary: Get passage by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Passage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updatePassage
      tags: [passages]
      summary: Update passage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PassageUpdate"
      responses:
        "200":
          description: Updated passage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passage"

    delete:
      operationId: deletePassage
      tags: [passages]
      summary: Delete passage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── TYPING SESSIONS (PRACTICE) ───────────────────────────────────────────────
  /typing-sessions:
    get:
      operationId: listTypingSessions
      tags: [typing]
      summary: List user's typing sessions
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: language
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Sessions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypingSessionListResponse"

    post:
      operationId: createTypingSession
      tags: [typing]
      summary: Start a new typing practice session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TypingSessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypingSession"

  /typing-sessions/{id}:
    get:
      operationId: getTypingSession
      tags: [typing]
      summary: Get typing session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Typing session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypingSession"

    patch:
      operationId: updateTypingSession
      tags: [typing]
      summary: Update/complete typing session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TypingSessionUpdate"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypingSession"

  /typing-sessions/stats:
    get:
      operationId: getTypingStats
      tags: [typing]
      summary: Get user's typing stats summary
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: language
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Typing stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypingStats"

  # ─── TESTS (EXAM MODE) ───────────────────────────────────────────────────────
  /tests:
    get:
      operationId: listTests
      tags: [tests]
      summary: List available tests
      parameters:
        - name: language
          in: query
          schema:
            type: string
        - name: speedCategory
          in: query
          schema:
            type: integer
        - name: instituteId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Tests list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestListResponse"

    post:
      operationId: createTest
      tags: [tests]
      summary: Create a new test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestInput"
      responses:
        "201":
          description: Created test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test"

  /tests/{id}:
    get:
      operationId: getTest
      tags: [tests]
      summary: Get test by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test"

    patch:
      operationId: updateTest
      tags: [tests]
      summary: Update test
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
