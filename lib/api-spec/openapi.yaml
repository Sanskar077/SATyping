          type: string
          enum: [pro_student, institute]

    Plan:
      type: object
      required: [id, name, price, features]
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        billingPeriod:
          type: string
        features:
          type: array
          items:
            type: string
        isPopular:
          type: boolean

    # ─── PERSONAL BESTS SCHEMAS (Feature 6) ───────────────────────────────────
    PersonalBests:
      type: object
      required: [highestWpm, highestAccuracy, bestGrossWpm, bestNetWpm, longestStreak, totalPracticeMinutes, totalCompletedTests]
      properties:
        highestWpm:
          type: number
        highestAccuracy:
          type: number
        bestGrossWpm:
          type: number
        bestNetWpm:
          type: number
        longestStreak:
          type: integer
        totalPracticeMinutes:
          type: integer
        totalCompletedTests:
          type: integer
        fastestImprovement:
          type: number
        weeklyBest:
          type: ["number", "null"]
        monthlyBest:
          type: ["number", "null"]
        byLanguage:
          type: array
          items:
            $ref: "#/components/schemas/LanguageStat"

    # ─── CURRICULUM SCHEMAS (Feature 5) ─────────────────────────────────────────
    LessonItem:
      type: object
      required: [id, language, category, title, content, orderIndex, minAccuracy, minWpm, isLocked]
      properties:
        id:
          type: integer
        language:
          type: string
          enum: [english, hindi, marathi]
        category:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        content:
          type: string
        targetKeys:
          type: ["string", "null"]
        orderIndex:
          type: integer
        minAccuracy:
          type: number
        minWpm:
          type: number
        isLocked:
          type: boolean
        isCompleted:
          type: boolean
        bestAccuracy:
          type: ["number", "null"]
        bestWpm:
          type: ["number", "null"]
        completionCount:
          type: integer

    LessonListResponse:
      type: object
      required: [lessons, total]
      properties:
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/LessonItem"
        total:
          type: integer

    CurriculumPath:
      type: object
      required: [language, categories, totalLessons, completedLessons]
      properties:
        language:
          type: string
          enum: [english, hindi, marathi]
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CurriculumCategory"
        totalLessons:
          type: integer
        completedLessons:
          type: integer

    CurriculumCategory:
      type: object
      required: [name, label, lessons]
      properties:
        name:
          type: string
        label:
          type: string
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/LessonItem"

    LessonCompletion:
      type: object
      required: [id, lessonId, accuracy, wpm, completedAt]
      properties:
        id:
          type: integer
        lessonId:
          type: integer
        accuracy:
          type: number
        wpm:
          type: number
        completedAt:
          type: string
          format: date-time

    LessonCompleteInput:
      type: object
      required: [accuracy, wpm]
      properties:
        accuracy:
          type: number
        wpm:
          type: number

    # ─── BULK IMPORT SCHEMAS (Feature 9) ─────────────────────────────────────────
    BulkPassageRow:
      type: object
      required: [title, content, language, difficulty, speedCategory]
      properties:
        title:
          type: string
        content:
          type: string
        language:
          type: string
          enum: [english, hindi, marathi]
        difficulty:
          type: string
          enum: [easy, medium, hard]
        speedCategory:
          type: integer
          enum: [30, 40, 50, 60]

    BulkImportInput:
      type: object
      required: [passages]
      properties:
        passages:
          type: array
          items:
            $ref: "#/components/schemas/BulkPassageRow"

    ValidationError:
      type: object
      required: [row, field, message]
      properties:
        row:
          type: integer
        field:
          type: string
        message:
          type: string

    DuplicateWarning:
      type: object
      required: [row, title, existingId]
      properties:
        row:
          type: integer
        title:
          type: string
        existingId:
          type: integer

    BulkImportValidation:
      type: object
      required: [valid, errors, duplicates, validCount]
      properties:
        valid:
          type: array
          items:
            $ref: "#/components/schemas/BulkPassageRow"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
        duplicates:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateWarning"
        validCount:
          type: integer
        errorCount:
          type: integer
        duplicateCount:
          type: integer

    BulkImportResult:
      type: object
      required: [imported, skipped, errors]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
        passages:
          type: array
          items:
            $ref: "#/components/schemas/Passage"
