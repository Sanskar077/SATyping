  /payments/checkout:
    post:
      operationId: createCheckout
      tags: [payments]
      summary: Create a Razorpay order for a plan purchase (server computes the real amount)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Checkout order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/verify:
    post:
      operationId: verifyPayment
      tags: [payments]
      summary: Verify a completed Razorpay checkout and activate the subscription
      description: >
        Called by the browser immediately after Razorpay's checkout handler fires. The server
        verifies the HMAC signature over `order_id|payment_id` using RAZORPAY_KEY_SECRET and, if
        valid, activates the payment (invoice, subscription, account access, commission).

        This is the same activation the webhook performs and the two are idempotent, so whichever
        arrives first wins. It exists because the webhook is an inbound call from Razorpay and can
        never reach a server running on localhost — without it, sandbox/local payments would stay
        pending forever.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentInput"
      responses:
        "200":
          description: Payment verified and activated (or already activated by the webhook)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentVerificationResult"
        "400":
          description: Signature verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The payment belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No payment matches the given order id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/webhook:
    post:
      operationId: paymentsWebhook
      tags: [payments]
      summary: Razorpay webhook receiver (signature-verified, not user-authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RazorpayWebhookPayload"
      responses:
        "200":
          description: Acknowledged
        "400":
          description: Invalid signature or payload

