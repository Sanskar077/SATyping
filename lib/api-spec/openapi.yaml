          description: Audit log list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

  /login-logs:
    get:
      operationId: listLoginLogs
      tags: [activity]
      summary: List login attempts, success and failure (owner only)
      parameters:
        - name: email
          in: query
          schema:
            type: string
        - name: success
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Login log list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginLogListResponse"

  # ─── ANALYTICS (owner only) ───────────────────────────────────────────────────
  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Platform-wide analytics for the Owner dashboard
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ─── AUTH SCHEMAS ─────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [email, password, name, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string
          minLength: 2
        role:
          type: string
          enum: [student, teacher, institute_admin]
        phone:
          type: ["string", "null"]
        instituteId:
          type: ["integer", "null"]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshTokenInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # ─── USER SCHEMAS ─────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, email, name, role, isActive, subscriptionPlan, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [student, teacher, institute_admin, super_admin]
        phone:
          type: ["string", "null"]
        isActive:
          type: boolean
        subscriptionPlan:
          type: string
          enum: [free, pro_student, institute]
        accountStatus:
          type: string
          enum: [inactive, active, suspended]
        premiumGrantedByOwner:
          type: boolean
        hasAccess:
          type: boolean
          description: Computed server-side — own accountStatus active, OR (if institute member) institute accountStatus active, OR role is super_admin.
        emailVerified:
          type: boolean
        instituteId:
          type: ["integer", "null"]
        instituteName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isActive:
          type: boolean

    UserListResponse:
      type: object
      required: [users, total, page, limit]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
